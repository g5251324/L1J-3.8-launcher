; ============================================================
; 自訂狀態圖示設定 (status_icons.ini)
; 位置:與 launcher.exe 放在同一個資料夾
; 功能:auto-buff(LHX「輔助」分頁)每次成功施放/使用 buff 時,
;       在畫面左上角顯示你自訂的狀態圖示(最多 3 個槽位)。
; 圖檔:放在 launcher.exe 旁的 icons/ 資料夾,例如 icons/haste.png
; 註解:行首或行內用 `;` 或 `#`
; ============================================================

[slot1]
; 觸發條件(二選一):
;   state:<id>   → buff 效果類別 id(對應 LHX 輔助分頁清單填的 id)
;                  id=0 加速類 / id=2 壯膽類 / id=10 通暢氣脈…
;                  (多個同類 buff 共用一個圖示)
;   name:<名稱>  → buff 條目名稱(更精確,可區分不同技能/物品)
trigger = state:0
; icons/ 資料夾內的 PNG 檔名(空 = 只畫色塊)
icon = haste.png
; 顯示秒數;0 = 常駐到登出(重新觸發會刷新)
duration = 60
; 圖示旁的文字(空 = 不畫)
label = 加速

[slot2]
trigger = state:2
icon = brave.png
duration = 300
label = 勇敢

[slot3]
trigger = state:10
icon = channel.png
duration = 0
label = 通暢

; 進階範例 — 用名稱精確指定單一技能:
; [slot1]
; trigger = name:體魄強化
; icon = mighty.png
; duration = 180
; label = 體魄
